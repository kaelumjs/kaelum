name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      kaelum_released: ${{ steps.release.outputs['packages/kaelum--release_created'] }}
      create_kaelum_released: ${{ steps.release.outputs['packages/create-kaelum--release_created'] }}
    steps:
      # Keeps a "release PR" open with the next version and changelog.
      # Merging that PR creates the tags and GitHub releases.
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    needs: release-please
    if: >-
      needs.release-please.outputs.kaelum_released == 'true' ||
      needs.release-please.outputs.create_kaelum_released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:dist
      - run: pnpm publint

      - name: Publish kaelum
        if: needs.release-please.outputs.kaelum_released == 'true'
        working-directory: packages/kaelum
        run: node ../../scripts/publish.mjs

      - name: Publish create-kaelum
        if: needs.release-please.outputs.create_kaelum_released == 'true'
        working-directory: packages/create-kaelum
        run: node ../../scripts/publish.mjs
