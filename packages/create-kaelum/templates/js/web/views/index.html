<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaelum</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Kaelum</h1>
      <p class="subtitle">Express, production-ready by default.</p>

      <div class="cards">
        <div class="card">
          <h3>Routes</h3>
          <p>
            <a href="/about">/about</a>, <a href="/about/team">/about/team</a>,
            <a href="/dashboard">/dashboard</a>, <a href="/dashboard/settings">/dashboard/settings</a>
          </p>
        </div>
        <div class="card">
          <h3>Secure defaults</h3>
          <p>Security headers, request IDs, logs and a body size limit are already on.</p>
        </div>
        <div class="card">
          <h3>Health check</h3>
          <p><a href="/health">/health</a> answers for load balancers and orchestrators.</p>
        </div>
      </div>
    </main>
  </body>
</html>
